# Copy to config.yaml to override local defaults. Never put a public PIN here.
host: 0.0.0.0
port: 8000
data_dir: data
admin_pin: "" # Blank: admin API only from this PC (loopback).
camera:
  mode: mock # mock | http | usb
  preview_mjpeg_url: ""
  snapshot_jpeg_url: ""
  snapshot_method: GET # GET | POST
  usb_index: 0
remote:
  port: "" # e.g. COM3, blank disables serial receiver
  baudrate: 115200
printer:
  mode: mock # mock saves PNG + PDF; windows submits to spooler
  name: "" # blank uses Windows default printer
capture_delay_seconds: 0
